<html>
    <head>
        <title>Arrays</title>
    </head>
    <body>
        <script>
let arr = [10, -5, 0, 20, -8, 0, 15];

let positiveSum = 0, negativeSum = 0, zeroCount = 0;

for (let i = 0; i < arr.length; i++) {
    if (arr[i] > 0)
        positiveSum += arr[i];
    else if (arr[i] < 0)
        negativeSum += arr[i];
    else
        zeroCount++;
}

console.log("Positive sum:", positiveSum);
console.log("Negative sum:", negativeSum);
console.log("Zero count:", zeroCount);
        </script>
        
    </body>
</html>
