<html>
<head>
    <title>Armstrong Numbers</title>
</head>

<body>
    <script>
        for (let num = 100; num <= 999; num++) {
            let originalNum = num;
            let temp = num;
            let sum = 0;

            while (temp > 0) {
                let digit = temp % 10;
                sum = sum + digit * digit * digit;
                temp = Math.floor(temp / 10);
            }

            if (sum === originalNum) {
                console.log(originalNum);
            }
        }
    </script>
</body>
</html>
