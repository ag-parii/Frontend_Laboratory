<html>
<head>
    <title>Multiplication Tables</title>
</head>

<body>
    <script>
        for (let num = 2; num <= 5; num++) {
            console.log("Table of " + num);

            for (let i = 1; i <= 10; i++) {
                console.log(num + " × " + i + " = " + (num * i));
            }

            console.log("----------------");
        }
    </script>
</body>
</html>
